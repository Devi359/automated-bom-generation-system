<!DOCTYPE html>
<html>
<head>
    <title>BOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>Assembly Parts and Details</h2>

    <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Qty</th>
                <th>Unit Price</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            {% for i in bom %}
            <tr>
                <td>{{ i.name }}</td>
                <td>{{ i.quantity }}</td>
                <td>₹ {{ i.unit_price }}</td>
                <td>₹ {{ i.total_price }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <h4 class="text-end">Grand Total: ₹ {{ total }}</h4>
</div>

</body>
</html>
