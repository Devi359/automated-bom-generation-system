<!DOCTYPE html>
<html>
<head>
    <title>BOM Industrial Login</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
        }

        /* LEFT */
        .left {
            width: 60%;
            position: relative;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            overflow: hidden;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);

            background-size: 40px 40px;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            from { transform: translate(0,0); }
            to { transform: translate(-40px,-40px); }
        }

        .left-content {
            z-index: 2;
            text-align: center;
        }

        .left-content h1 {
            font-size: 40px;
        }

        .left-content p {
            color: #ccc;
            font-size: 18px;
        }

        /* RIGHT */
        .right {
            width: 40%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 330px;
            padding: 30px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
        }

        .tag {
            color: #00c6ff;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 16px;
            cursor: pointer;
            color: white;
            transition: .3s;
        }

        .user-btn {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
        }

        .admin-btn {
            background: linear-gradient(45deg, #ff512f, #dd2476);
        }

        .btn:hover {
            transform: scale(1.04);
        }

        a {
            text-decoration: none;
        }

    </style>

</head>

<body>

    <!-- LEFT -->
    <div class="left">

        <div class="grid"></div>

        <div class="left-content">
            <h1>Industrial BOM System</h1>
            <p>CAD • Assembly • Costing • Billing</p>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="login-box">

            <div class="tag">Onshape Integration</div>

            <h2>Welcome</h2>

            <!-- USER -->
            <a href="/login">
                <button class="btn user-btn">
                    User Login
                </button>
            </a>

            <!-- ADMIN -->
            <a href="/admin_login">
                <button class="btn admin-btn">
                    Admin Login
                </button>
            </a>

        </div>

    </div>

</body>
</html>
