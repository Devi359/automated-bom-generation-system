<!DOCTYPE html>
<html>
<head>
    <title>Price Management</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            overflow:hidden;
        }

        /* animated blueprint grid */
        .grid{
            position:absolute;
            width:200%;
            height:200%;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size:40px 40px;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid{
            from {transform: translate(0,0);}
            to {transform: translate(-40px,-40px);}
        }

        .container{
            position:relative;
            z-index:2;
            width:450px;
            padding:40px;
            border-radius:20px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px);
            box-shadow:0 8px 30px rgba(0,0,0,0.5);
            color:white;
        }

        h1{
            text-align:center;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#bbb;
            margin-bottom:30px;
            font-size:14px;
        }

        .input-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            color:#ddd;
        }

        input{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:rgba(255,255,255,0.08);
            color:white;
            font-size:15px;
            outline:none;
        }

        input:focus{
            border:1px solid #00c6ff;
        }

        .btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:linear-gradient(45deg,#00c6ff,#0072ff);
            color:white;
            font-size:16px;
            cursor:pointer;
            margin-top:10px;
            transition:0.3s;
        }

        .btn:hover{
            transform:scale(1.03);
            box-shadow:0 0 20px rgba(0,198,255,0.4);
        }

        .back-btn{
            display:block;
            text-align:center;
            margin-top:18px;
            color:#bbb;
            text-decoration:none;
        }

    </style>

</head>
<body>

    <div class="grid"></div>

    <div class="container">

        <h1>Price Management</h1>
        <div class="subtitle">
            Admin Control Panel • BOM Cost Configuration
        </div>

        <form method="POST">

            <div class="input-group">
                <label>Part Name</label>
                <input type="text" name="part_name" placeholder="Ex: Bolt M8" required>
            </div>

            <div class="input-group">
                <label>Updated Price (₹)</label>
                <input type="number" name="price" placeholder="Ex: 25" required>
            </div>

            <button type="submit" class="btn">
                Update Price
            </button>

        </form>

        <a href="/admin_dashboard" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
