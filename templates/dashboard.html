<!DOCTYPE html>
<html>
<head>
    <title>Industrial Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            height: 100vh;
            background: #0f2027;
        }

        /* 🔷 SIDEBAR */
        .sidebar {
            width: 230px;
            background: linear-gradient(180deg, #141e30, #243b55);
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .menu a {
            display: block;
            padding: 12px;
            margin: 10px 0;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .menu a:hover {
            background: rgba(255,255,255,0.1);
        }

        /* 🔶 MAIN CONTENT */
        .main {
            flex: 1;
            padding: 30px;
            color: white;
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cards {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            padding: 25px;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .btn {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .header-title {
            font-size: 24px;
        }

        .sub-text {
            color: #bbb;
            font-size: 14px;
        }

    </style>
</head>

<body>

<!-- 🔷 SIDEBAR -->
<div class="sidebar">
    <h2>BOM System</h2>

    <div class="menu">
        <a href="/dashboard">🏠 Dashboard</a>
        <a href="/fetch_details">📊 BOM View</a>
        <a href="/view_tree">🌳 Hierarchy</a>
        <a href="/download_csv">📄 CSV Export</a>
        <a href="/download_pdf">🧾 PDF Invoice</a>
    </div>
</div>

<!-- 🔶 MAIN -->
<div class="main">

    <div class="topbar">
        <div>
            <div class="header-title">Industrial Dashboard</div>
            <div class="sub-text">Onshape BOM & Costing System</div>
        </div>
    </div>

    <!-- CARDS -->
    <div class="cards">

        <div class="card">
            <h3>BOM Details</h3>
            <p>View part list with cost</p>
            <a href="/fetch_details" class="btn">Open</a>
        </div>

        <div class="card">
            <h3>Hierarchy Tree</h3>
            <p>Assembly structure</p>
            <a href="/view_tree" class="btn">View</a>
        </div>

        <div class="card">
            <h3>CSV Export</h3>
            <p>Download BOM</p>
            <a href="/download_csv" class="btn">Download</a>
        </div>

        <div class="card">
            <h3>PDF Invoice</h3>
            <p>Generate bill</p>
            <a href="/download_pdf" class="btn">Generate</a>
        </div>

    </div>

</div>

</body>
</html>
